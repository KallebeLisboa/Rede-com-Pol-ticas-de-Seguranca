services:
  gateway:
    build: ./gateway
    container_name: gateway
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./capturas:/capturas
    networks:
      rede_clientes:
        ipv4_address: 172.20.0.2
      rede_servidores:
        ipv4_address: 172.21.0.2

  cliente:
    build: ./cliente
    container_name: cliente
    cap_add:
      - NET_ADMIN
    depends_on:
      - gateway
    volumes:
      - ./capturas:/capturas
      - ./testes:/testes
    networks:
      rede_clientes:
        ipv4_address: 172.20.0.10

  servidor_web:
    build: ./nginx
    container_name: servidor_web
    cap_add:
      - NET_ADMIN
    depends_on:
      - gateway
      - app_python
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      rede_servidores:
        ipv4_address: 172.21.0.10

  app_python:
    build: ./app
    container_name: app_python
    cap_add:
      - NET_ADMIN
    depends_on:
      - gateway
    networks:
      rede_servidores:
        ipv4_address: 172.21.0.20

networks:
  rede_clientes:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/24
  rede_servidores:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24